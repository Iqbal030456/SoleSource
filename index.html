<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLE SOURCE - Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&family=Open+Sans+Hebrew+Condensed:wght@400&family=Inter:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-[#1a3a52] py-4 w-full flex items-center justify-between" style="padding-left: 120px; padding-right: 122px;">
        <!-- Menu Button (Left) -->
        <button id="menuBtn" class="menu-btn">
            <!-- Menu Icon - Ganti 'menu-icon.png' dengan nama file PNG Anda -->
            <img src="menu-icon.png" alt="Menu" class="w-10 h-10">
        </button>

        <!-- Logo Text (Center) -->
        <div class="logo-text text-white text-2xl font-normal tracking-wider">
            SOLE SOURCE
        </div>

        <!-- Search Bar (Right) -->
        <div class="search-container bg-white rounded-lg px-4 py-2 flex items-center gap-2 w-80">
            <!-- Search Icon - Ganti 'search-icon.png' dengan nama file PNG Anda -->
            <img src="search-icon.png" alt="Search" class="w-[14px] h-[14px]">
            <input 
                type="text" 
                placeholder="Search Products..." 
                class="search-input flex-1 outline-none text-gray-700 text-sm"
            >
        </div>
    </header>

    <!-- Sidebar Menu -->
    <div id="sidebar" class="sidebar">
        <!-- Sidebar Header dengan Logo dan Text -->
        <div class="sidebar-header">
            <img src="logo-sidebar.png" alt="Logo" class="sidebar-logo">
            <div class="sidebar-brand">
                <div class="sidebar-brand-text">SOLE</div>
                <div class="sidebar-brand-text">SOURCE</div>
            </div>
            <!-- Close Button -->
            <button id="closeSidebar" class="close-sidebar-btn">
                <div class="close-btn-bg">
                    <img src="close-icon.png" alt="Close" class="close-icon">
                </div>
            </button>
        </div>

        <!-- Sidebar Menu Items -->
        <nav class="sidebar-nav">
            <a href="home.html" class="sidebar-item">
                <span>Home</span>
                <img src="arrow-right.png" alt="Arrow" class="sidebar-arrow">
            </a>
            <a href="news.html" class="sidebar-item">
                <span>News</span>
                <img src="arrow-right.png" alt="Arrow" class="sidebar-arrow">
            </a>
            <a href="about.html" class="sidebar-item">
                <span>About</span>
                <img src="arrow-right.png" alt="Arrow" class="sidebar-arrow">
            </a>
            <a href="new-items.html" class="sidebar-item">
                <span>New Items</span>
                <img src="arrow-right.png" alt="Arrow" class="sidebar-arrow">
            </a>
            <a href="popular-items.html" class="sidebar-item">
                <span>Popular Items</span>
                <img src="arrow-right.png" alt="Arrow" class="sidebar-arrow">
            </a>
            <a href="contact.html" class="sidebar-item">
                <span>Contact Us</span>
                <img src="arrow-right.png" alt="Arrow" class="sidebar-arrow">
            </a>
        </nav>
    </div>

    <!-- Overlay (Background Gelap) -->
    <div id="overlay" class="overlay"></div>

    <!-- Main Content Area -->
    <main class="flex-1 gradient-bg">
        <!-- Konten akan ditambahkan di sini nanti -->
    </main>

    <!-- Footer -->
    <footer class="bg-[#1a3a52] w-full relative" style="padding-left: 120px; padding-right: 122px; padding-top: 60px; padding-bottom: 40px; min-height: 280px;">
        <!-- Decorative Circles (Placeholder untuk PNG) - Pojok Kanan Atas -->
        <div class="decorative-circles">
            <img src="footer-circles.png" alt="Decorative Circles" class="circles-image">
        </div>
        
        <div class="max-w-full mx-auto relative z-10">
            <!-- Logo, Text and Social Media Section -->
            <div class="flex items-center mb-12">
                <!-- Left Side: Logo and Text -->
                <div class="flex items-center" style="gap: 16px;">
                    <!-- Logo - Ganti 'logo.png' dengan nama file PNG Anda -->
                    <img src="logo.png" alt="Logo" class="w-[100px] h-[40px]">
                    <div class="footer-text text-white font-normal tracking-wider" style="font-size: 40px; line-height: 40px;">
                        SOLE SOURCE
                    </div>
                </div>

                <!-- Right Side: Social Media Icons -->
                <div class="flex items-center" style="gap: 8px; margin-left: 47px;">
                    <!-- Instagram Icon - Link ke Instagram -->
                    <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
                        <img src="instagram-icon.png" alt="Instagram" class="w-[40px] h-[40px] cursor-pointer hover:opacity-80 transition-opacity">
                    </a>
                    <!-- WhatsApp Icon - Link ke WhatsApp -->
                    <a href="https://wa.me/" target="_blank" rel="noopener noreferrer">
                        <img src="whatsapp-icon.png" alt="WhatsApp" class="w-[40px] h-[40px] cursor-pointer hover:opacity-80 transition-opacity">
                    </a>
                    <!-- Twitter/X Icon - Link ke Twitter/X -->
                    <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">
                        <img src="twitter-icon.png" alt="Twitter" class="w-[40px] h-[40px] cursor-pointer hover:opacity-80 transition-opacity">
                    </a>
                </div>
            </div>

            <!-- Divider Line - DIPERBAIKI: Tambah padding kanan agar tidak nyentuh circles -->
            <div class="border-t border-[#9DF29C] mb-6" style="margin-right: 380px;"></div>

            <!-- Copyright - DIPERBAIKI: Tambah padding kanan agar tidak nyentuh circles -->
            <div class="copyright-text text-[#FFFFFF] text-sm text-center" style="padding-right: 380px;">
                ©2025 SOLE SOURCE
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
