<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLE SOURCE - Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&family=Open+Sans+Hebrew+Condensed:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-[#1a3a52] py-4 w-full flex items-center justify-between" style="padding-left: 120px; padding-right: 122px;">
        <!-- Menu Button (Left) -->
        <button id="menuBtn" class="menu-btn">
            <!-- Menu Icon - Ganti 'menu-icon.png' dengan nama file PNG Anda -->
            <img src="menu-icon.png" alt="Menu" class="w-10 h-10">
        </button>

        <!-- Logo Text (Center) -->
        <div class="logo-text text-white text-2xl font-normal tracking-wider">
            SOLE SOURCE
        </div>

        <!-- Search Bar (Right) -->
        <div class="search-container bg-white rounded-lg px-4 py-2 flex items-center gap-2 w-80">
            <!-- Search Icon - Ganti 'search-icon.png' dengan nama file PNG Anda -->
            <img src="search-icon.png" alt="Search" class="w-5 h-5">
            <input 
                type="text" 
                placeholder="Search Products..." 
                class="search-input flex-1 outline-none text-gray-700 text-sm"
            >
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 gradient-bg">
        <!-- Konten akan ditambahkan di sini nanti -->
    </main>

    <!-- Footer -->
    <footer class="bg-[#1a3a52] py-8 w-full" style="padding-left: 120px; padding-right: 122px;">
        <div class="max-w-full mx-auto">
            <!-- Logo, Text and Social Media Section -->
            <div class="flex items-center mb-8">
                <!-- Left Side: Logo and Text -->
                <div class="flex items-center" style="gap: 16px;">
                    <!-- Logo - Ganti 'logo.png' dengan nama file PNG Anda -->
                    <img src="logo.png" alt="Logo" class="w-[100px] h-[40px]">
                    <div class="footer-text text-white font-normal tracking-wider" style="font-size: 40px; line-height: 40px;">
                        SOLE SOURCE
                    </div>
                </div>

                <!-- Right Side: Social Media Icons -->
                <div class="flex items-center" style="gap: 8px; margin-left: 47px;">
                    <!-- Instagram Icon - Ganti 'instagram-icon.png' dengan nama file PNG Anda -->
                    <img src="instagram-icon.png" alt="Instagram" class="w-[40px] h-[40px]">
                    <!-- WhatsApp Icon - Ganti 'whatsapp-icon.png' dengan nama file PNG Anda -->
                    <img src="whatsapp-icon.png" alt="WhatsApp" class="w-[40px] h-[40px]">
                    <!-- Twitter/X Icon - Ganti 'twitter-icon.png' dengan nama file PNG Anda -->
                    <img src="twitter-icon.png" alt="Twitter" class="w-[40px] h-[40px]">
                </div>
            </div>

            <!-- Divider Line -->
            <div class="border-t border-[#9DF29C] mb-4"></div>

            <!-- Copyright -->
            <div class="copyright-text text-[#FFFFFF] text-sm text-center">
                ©2025 SOLE SOURCE
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
