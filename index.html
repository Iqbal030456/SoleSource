<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLE SOURCE - Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&family=Open+Sans+Hebrew+Condensed:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-[#1a3a52] py-4 w-full flex items-center justify-between" style="padding-left: 120px; padding-right: 122px;">
        <!-- Menu Button (Left) -->
        <button id="menuBtn" class="menu-btn">
            <!-- Menu Icon Placeholder - Persegi untuk PNG nanti -->
            <div class="menu-icon-placeholder w-10 h-10 bg-white rounded"></div>
        </button>

        <!-- Logo Text (Center) -->
        <div class="logo-text text-white text-2xl font-normal tracking-wider">
            SOLE SOURCE
        </div>

        <!-- Search Bar (Right) -->
        <div class="search-container bg-white rounded-lg px-4 py-2 flex items-center gap-2 w-80">
            <!-- Search Icon Placeholder -->
            <div class="search-icon-placeholder w-5 h-5 bg-gray-300 rounded"></div>
            <input 
                type="text" 
                placeholder="Search Products..." 
                class="search-input flex-1 outline-none text-gray-700 text-sm"
            >
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 gradient-bg">
        <!-- Konten akan ditambahkan di sini nanti -->
    </main>

    <!-- Footer -->
    <footer class="bg-[#1a3a52] py-8 w-full" style="padding-left: 120px; padding-right: 122px;">
        <div class="max-w-full mx-auto">
            <!-- Logo, Text and Social Media Section -->
            <div class="flex items-center mb-8">
                <!-- Left Side: Logo and Text -->
                <div class="flex items-center" style="gap: 16px;">
                    <!-- Logo Placeholder -->
                    <div class="logo-placeholder w-[100px] h-[40px] bg-gray-400 rounded"></div>
                    <div class="footer-text text-white font-normal tracking-wider" style="font-size: 40px; line-height: 40px;">
                        SOLE SOURCE
                    </div>
                </div>

                <!-- Right Side: Social Media Icons -->
                <div class="flex items-center" style="gap: 8px; margin-left: 47px;">
                    <!-- Instagram Icon Placeholder -->
                    <div class="social-icon-placeholder w-[40px] h-[40px] bg-[#9DF29C] rounded"></div>
                    <!-- WhatsApp Icon Placeholder -->
                    <div class="social-icon-placeholder w-[40px] h-[40px] bg-[#9DF29C] rounded"></div>
                    <!-- Twitter/X Icon Placeholder -->
                    <div class="social-icon-placeholder w-[40px] h-[40px] bg-[#9DF29C] rounded"></div>
                </div>
            </div>

            <!-- Divider Line -->
            <div class="border-t border-[#9DF29C] mb-4"></div>

            <!-- Copyright -->
            <div class="copyright-text text-[#FFFFFF] text-sm text-center">
                ©2025 SOLE SOURCE
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
